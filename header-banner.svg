<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200">
<defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#140a25" />
        <stop offset="100%" stop-color="#06060c" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
</defs>

<style>
    .bg { fill: url(#bgGradient); }
    .grid-line { stroke: #2a1b41; stroke-width: 1; opacity: 0.5; }
    
    .title-text {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 56px;
        fill: #ffffff;
        letter-spacing: 4px;
        font-style: italic;
    }
    .subtitle-text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 16px;
        fill: #00f0ff;
        letter-spacing: 2px;
    }
    
    .node-pink {
        fill: #ff003c;
        filter: url(#glow-pink);
        animation: pulse 2s infinite alternate;
    }
    .node-cyan {
        fill: #00f0ff;
        filter: url(#glow-cyan);
        animation: pulse 3s infinite alternate-reverse;
    }
    
    .data-line {
        stroke: #00f0ff;
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 20 80;
        animation: slide 4s linear infinite;
    }

    @keyframes pulse {
        0% { opacity: 0.3; r: 2; }
        100% { opacity: 1.0; r: 6; }
    }
    
    @keyframes slide {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
    }
    
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
    }
</style>

<!-- Background & Grid -->
<rect width="100%" height="100%" class="bg" rx="10" />
<line x1="0" y1="0" x2="0" y2="200" class="grid-line" />
<line x1="40" y1="0" x2="40" y2="200" class="grid-line" />
<line x1="80" y1="0" x2="80" y2="200" class="grid-line" />
<line x1="120" y1="0" x2="120" y2="200" class="grid-line" />
<line x1="160" y1="0" x2="160" y2="200" class="grid-line" />
<line x1="200" y1="0" x2="200" y2="200" class="grid-line" />
<line x1="240" y1="0" x2="240" y2="200" class="grid-line" />
<line x1="280" y1="0" x2="280" y2="200" class="grid-line" />
<line x1="320" y1="0" x2="320" y2="200" class="grid-line" />
<line x1="360" y1="0" x2="360" y2="200" class="grid-line" />
<line x1="400" y1="0" x2="400" y2="200" class="grid-line" />
<line x1="440" y1="0" x2="440" y2="200" class="grid-line" />
<line x1="480" y1="0" x2="480" y2="200" class="grid-line" />
<line x1="520" y1="0" x2="520" y2="200" class="grid-line" />
<line x1="560" y1="0" x2="560" y2="200" class="grid-line" />
<line x1="600" y1="0" x2="600" y2="200" class="grid-line" />
<line x1="640" y1="0" x2="640" y2="200" class="grid-line" />
<line x1="680" y1="0" x2="680" y2="200" class="grid-line" />
<line x1="720" y1="0" x2="720" y2="200" class="grid-line" />
<line x1="760" y1="0" x2="760" y2="200" class="grid-line" />
<line x1="800" y1="0" x2="800" y2="200" class="grid-line" />
<line x1="840" y1="0" x2="840" y2="200" class="grid-line" />
<line x1="0" y1="0" x2="860" y2="0" class="grid-line" />
<line x1="0" y1="40" x2="860" y2="40" class="grid-line" />
<line x1="0" y1="80" x2="860" y2="80" class="grid-line" />
<line x1="0" y1="120" x2="860" y2="120" class="grid-line" />
<line x1="0" y1="160" x2="860" y2="160" class="grid-line" />


<!-- Animated Data Lines -->
<path class="data-line" d="M 0,50 L 200,50 L 250,100 L 860,100" />
<path class="data-line" d="M 860,150 L 650,150 L 600,80 L 0,80" style="animation-duration: 6s;" />

<!-- Glowing Nodes -->
<circle cx="200" cy="50" r="4" class="node-pink" />
<circle cx="250" cy="100" r="4" class="node-cyan" />
<circle cx="650" cy="150" r="4" class="node-pink" style="animation-delay: 1s;" />
<circle cx="600" cy="80" r="4" class="node-cyan" style="animation-delay: 1s;" />

<!-- Text Content (Floating) -->
<g style="animation: float 6s ease-in-out infinite;">
    <!-- Cyberpunk Glitch Effect Text (Cyan layer offset behind White) -->
    <text x="430" y="110" class="title-text" text-anchor="middle" fill="#00f0ff" style="opacity:0.8; transform: translate(3px, 3px);">PRUTHVI</text>
    <text x="430" y="110" class="title-text" text-anchor="middle">PRUTHVI</text>
    
    <text x="430" y="145" class="subtitle-text" text-anchor="middle">/// HARDWARE and SOFTWARE ENGINEER</text>
</g>

<!-- Accent blocks -->
<rect x="40" y="40" width="30" height="10" fill="#ff003c" opacity="0.8" />
<rect x="790" y="150" width="30" height="10" fill="#00f0ff" opacity="0.8" />

</svg>
