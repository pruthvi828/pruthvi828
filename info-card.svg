<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 225" width="490" height="225">
<style>
    .terminal-text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        white-space: pre;
    }
    .title { fill: #39d353; font-weight: bold; }
    .label { fill: #58a6ff; font-weight: bold; }
    .value { fill: #c9d1d9; }

    @keyframes fadeInSlide {
        0% { opacity: 0; transform: translateX(-10px); }
        100% { opacity: 1; transform: translateX(0); }
    }
    .fade-in {
        opacity: 0;
        animation: fadeInSlide 0.3s ease-out forwards;
    }
</style>
<rect width="100%" height="100%" fill="#0d1117" rx="8" />
<g transform="translate(20, 30)">
    <text class='terminal-text title fade-in' x='0' y='0' style='animation-delay: 0s;'>engineer@github</text>
    <text class='terminal-text fade-in' x='0' y='10' style='animation-delay: 0s;' fill='#c9d1d9'>-------------------</text>
    <g class='fade-in' style='animation-delay: 0.2s;'>
        <text class='terminal-text label' x='0' y='35'>Role</text>
        <text class='terminal-text value' x='100' y='35'>: Hardware and Software Engineer</text>
    </g>
    <g class='fade-in' style='animation-delay: 0.4s;'>
        <text class='terminal-text label' x='0' y='60'>Embedded</text>
        <text class='terminal-text value' x='100' y='60'>: Microcontrollers, Systems Design</text>
    </g>
    <g class='fade-in' style='animation-delay: 0.6000000000000001s;'>
        <text class='terminal-text label' x='0' y='85'>Hardware</text>
        <text class='terminal-text value' x='100' y='85'>: KiCad, PCB Routing, AutoCAD</text>
    </g>
    <g class='fade-in' style='animation-delay: 0.8s;'>
        <text class='terminal-text label' x='0' y='110'>Software</text>
        <text class='terminal-text value' x='100' y='110'>: Software Development</text>
    </g>
    <g class='fade-in' style='animation-delay: 1.0s;'>
        <text class='terminal-text label' x='0' y='135'>Status</text>
        <text class='terminal-text value' x='100' y='135'>: Building awesome tech!</text>
    </g>

</g>
</svg>
